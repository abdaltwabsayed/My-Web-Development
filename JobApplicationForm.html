<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A job application form for submitting applications to open positions">
    <meta property="og:title" content="Job Application Form" />
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://thumbs.dreamstime.com/b/cv-writing-job-application-resume-gray-icon-vector-graphics-various-use-187075464.jpg?w=768" />
    <meta property="og:url" content="https://www.freecodecamp.org" />
    <link rel="stylesheet" href="styles/JobApplicationForm.css">
    <title>Job Application Form</title>
</head>
<body>
    <div id="container">
        <h1 class="title center">Job Application Form</h1>
        <p class="description center">Please fill out the form below to apply for a job position.</p>

        <form>
            <label for="name">Full Name: </label>
            <input
                type="text"
                name="name"
                id="name"
                required
                placeholder="E.g., Jane Doe"
            />
            
            <label for="email">Email: </label>
            <input
                type="email"
                name="email"
                id="email"
                required
                placeholder="E.g., jane.doe@example.com"
            />

            <label for="position">Position: </label>
            <select
                name="position"
                id="position"
                required
            >
                <option value="">Select a position</option>
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="manager">Manager</option>
            </select>

            <fieldset class="radio-group">
            <legend>Availability</legend>
            <input
                id="full-time"
                class="availability-radio-btn"
                type="radio"
                name="availability"
                value="full-time"
                checked
            />
            <label class="availability-label" for="full-time">Full-Time</label>

            <input
                id="part-time"
                class="availability-radio-btn"
                type="radio"
                name="availability"
                value="part-time"
            />
            <label class="availability-label" for="part-time">Part-Time</label>
            </fieldset>

            <label for="message">Why do you want this job?</label>
            <textarea id="message" name="message" rows="4" cols="50" required></textarea>

            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>

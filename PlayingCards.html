<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="This is a playing cards page made with flexbox theory.">
    <meta property="og:title" content="Playing Cards" />
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://as2.ftcdn.net/v2/jpg/19/47/64/85/1000_F_1947648503_Cdu8INhJ4JCl3Stgsu05oYWIK8frCjhq.jpg" />
    <meta property="og:url" content="https://www.freecodecamp.org" />
    <link href="styles/PlayingCards.css" rel="stylesheet">
    <title>Playing Cards</title>
</head>
<body>
    <main id="playing-cards">
        <div class="cards">
            <div class="left">
                <div>A</div>
                <div>♠</div>
            </div>
            <div class="middle">
                <div>♠</div>
            </div>
            <div class="right">
               <div class="flipped">♠</div> 
                <div class="flipped">A</div>
            </div>
        </div>
        <div class="cards red">
            <div class="left">
                <div>2</div>
                <div>♣</div>
            </div>
            <div class="middle">
                <div>♣</div>
                <div class="flipped">♣</div>
            </div>
            <div class="right">
                <div class="flipped">♣</div>
                <div class="flipped">2</div>
            </div>
        </div>
        <div class="cards red">
            <div class="left">
                <div>3</div>
                <div>♥</div>
            </div>
            <div class="middle">
                <div>♥</div>
                <div>♥</div>
                <div class="flipped">♥</div>
            </div>
            <div class="right">
                <div class="flipped">♥</div>
                <div class="flipped">3</div>
            </div>
        </div>
        <div class="cards">
            <div class="left">
                <div>4</div>
                <div>♦</div>
            </div>
            <div class="middle">
                <div class="middle-section">
                    <div>♦</div>
                    <div>♦</div>
                </div>
                <div class="middle-section flipped">
                    <div>♦</div>
                    <div>♦</div>
                </div>
            </div>
            <div class="right">
                <div class="flipped">♦</div>
                <div class="flipped">4</div>
            </div>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A weekly meeting availability table showing available times from Monday through Friday.">
    <meta property="og:title" content="Availability Table" />
    <meta property="og:type" content="website">
    <meta property="og:image"
        content="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=80" />
    <meta property="og:url" content="https://www.freecodecamp.org" />
    <link rel="stylesheet" href="styles/AvailabilityTable.css">
    <title>Availability Table</title>
</head>

<body>
    <table>
        <caption>Weekly Meeting Availability Schedule</caption>
        <tr class="sharp">
            <th class="time" scope="row" rowspan="2">9 AM</th>
            <th class="days" scope="col">Monday</th>
            <th class="days" scope="col">Tuesday</th>
            <th class="days" scope="col">Wednesday</th>
            <th class="days" scope="col">Thursday</th>
            <th class="days" scope="col">Friday</th>
        </tr>

        <tr class="sharp">
            <td class="available-0" aria-label="0 available"></td>
            <td class="available-1" aria-label="1 available"></td>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
        </tr>
        <tr class="half">
            <th class="time" scope="row" rowspan="2">10 AM</th>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
        </tr>
        <tr class="sharp">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
        </tr>
        <tr class="half">
            <th class="time" scope="row" rowspan="2">11 AM</th>
            <td class="available-0" aria-label="0 available"></td>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-0" aria-label="0 available"></td>
        </tr>
        <tr class="sharp">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-1" aria-label="1 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
        </tr>
        <tr class="half">
            <th class="time" scope="row" rowspan="2">12 PM</th>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-0" aria-label="0 available"></td>
        </tr>
        <tr class="sharp">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-0" aria-label="0 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
        </tr>
        <tr class="half">
            <th class="time" scope="row" rowspan="2">1 PM</th>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-0" aria-label="0 available"></td>
        </tr>
        <tr class="sharp">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
        </tr>
        <tr class="half">
            <th class="time" scope="row" rowspan="2">2 PM</th>
            <td class="available-0" aria-label="0 available"></td>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
        </tr>
        <tr class="sharp">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
        </tr>
        <tr class="half">
            <th class="time" scope="row" rowspan="2">3 PM</th>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-4" aria-label="4 available"></td>
        </tr>
        <tr class="sharp">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
        </tr>
        <tr class="half">
            <th class="time" scope="row" rowspan="2">4 PM</th>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
        </tr>
        <tr class="sharp">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-0" aria-label="0 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
        </tr>
        <tr class="sharp">
            <th class="time" scope="row" rowspan="2">5 PM</th>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
        </tr>
    </table>
    <div id="legend">
        <span>Availability</span>
        <div>0<div id="legend-gradient"></div>5+</div>
    </div>
</body>

</html>

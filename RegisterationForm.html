<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A registration form that collects user information such as name, email, password, country, profile picture, age, interests, and bio.">
    <meta property="og:title" content="Registration Form" />
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://thumbs.dreamstime.com/b/cv-writing-job-application-resume-gray-icon-vector-graphics-various-use-187075464.jpg?w=768" />
    <meta property="og:url" content="https://depi.gov.eg/login" />
    <link href="styles/RegisterationForm.css" rel="stylesheet">
  <title>Registration Form</title>
</head>
<body>
  <h1>Registration Form</h1>
  <p>Please fill out this form with the required information</p>
  <form method="post">
    <fieldset>
      <label for="first-name">Enter Your First Name: <input id="first-name" name="first-name" type="text" required /></label>
      <label for="last-name">Enter Your Last Name: <input id="last-name" name="last-name" type="text" required /></label>
      <label for="email">Enter Your Email: <input id="email" name="email" type="email" required /></label>
      <label for="new-password">Create a New Password: <input id="new-password" name="new-password" type="password" pattern="[a-z0-5]{8,}" required /></label>
      <label for="confirm-password">Confirm the Password: <input id="confirm-password" name="new-password" type="password" pattern="[a-z0-5]{8,}" required /></label>
      <label for="age">Input your age (years): <input id="age" type="number" name="age" min="13" max="120" /></label>
      <label for="country">Country:
        <select id="country" name="country" required>
          <option value="" selected disabled>(Select Country)</option>
          <option value="1">Egypt</option>
          <option value="2">Saudi Arabia</option>
          <option value="3">Kuwait</option>
          <option value="4">Qatar</option>
          <option value="5">Emirates</option>
          <option value="6">Morocco</option>
          <option value="7">Algeria</option>
          <option value="8">Tunisia</option>
          <option value="9">Jordan</option>
          <option value="10">Lebanon</option>
          <option value="11">Syria</option>
          <option value="12">Iraq</option>
          <option value="13">Other</option>
        </select>
      </label>
    </fieldset>
    <fieldset>
      <legend>Gender: </legend>
      <label for="male"><input id="male" type="radio" name="gender" value="male" class="inline" checked /> Male</label>
      <label for="female"><input id="female" type="radio" name="gender" value="female" class="inline" /> Female</label>
    </fieldset>
    <fieldset id="flex-container">
      <legend>Interests (Choose Many): </legend>
      <div class="flex">
        <label for="coding"><input id="coding" type="checkbox" name="interests" value="coding" class="inline" checked /> Coding</label>
        <label for="design"><input id="design" type="checkbox" name="interests" value="design" class="inline" /> Design</label>
        <label for="music"><input id="music" type="checkbox" name="interests" value="music" class="inline"  /> Music</label>
      </div>
      <div class="flex">
        <label for="sports"><input id="sports" type="checkbox" name="interests" value="sports" class="inline" /> Sports</label>
        <label for="travel"><input id="travel" type="checkbox" name="interests" value="travel" class="inline" /> Travel</label>
        <label for="reading"><input id="reading" type="checkbox" name="interests" value="reading" class="inline"  /> Reading</label>
      </div>
      <div class="flex">
        <label for="gaming"><input id="gaming" type="checkbox" name="interests" value="gaming" class="inline" /> Gaming</label>
        <label for="photography"><input id="photography" type="checkbox" name="interests" value="photography" class="inline" /> Photography</label>
        <label for="cooking"><input id="cooking" type="checkbox" name="interests" value="cooking" class="inline" /> Cooking</label>
      </div>
    </fieldset>
    <fieldset>
      <label for="profile-picture">Upload a profile picture: <input id="profile-picture" type="file" name="file" /></label>
      <label for="bio">Provide a bio:
        <textarea id="bio" name="bio" rows="3" cols="30" placeholder="I like coding on the beach..."></textarea>
      </label>
    </fieldset>
    <a href="https://depi.gov.eg/content/faqs">Read our terms and conditions</a>
    <label for="terms-and-conditions">
      <input class="inline" name="terms" id="terms-and-conditions" type="checkbox" required />
      I accept the terms and conditions
    </label>
    <input type="submit" value="Submit" />
  </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A styled marker pens page using CSS linear gradients and box shadows to create a realistic look.">
    <meta property="og:title" content="Marker Pens" />
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://www.canva.com/graphics/MAFxPxlKbxo-ai-icon/" />
    <meta property="og:url" content="https://www.freecodecamp.org" />
    <link rel="stylesheet" href="styles/MarkerPens.css">
    <title>Marker Pens</title>
</head>
<body>
    <h1>CSS Color Markers</h1>
    <div class="container">
      <div class="marker red">
        <div class="cap"></div>
        <div class="sleeve"></div>
      </div>
      <div class="marker green">
        <div class="cap"></div>
        <div class="sleeve"></div>
      </div>
      <div class="marker blue">
        <div class="cap"></div>
        <div class="sleeve"></div>
      </div>
    </div>
    <h1>Hued Boxes</h1>
    <div class="color-grid">
        <div class="color-box color1"></div>
        <div class="color-box color2"></div>
        <div class="color-box color3"></div>
        <div class="color-box color4"></div>
        <div class="color-box color5"></div>
    </div>
    <h1>Colored Boxes Layout</h1>
    <div class="flex-container">
      <div class="box box1">
        <h2>Box 1</h2>
        <p>Red</p>
      </div>
      <div class="box box2">
        <h2>Box 2</h2>
        <p>Orange</p>
      </div>
      <div class="box box3">
        <h2>Box 3</h2>
        <p>Yellow</p>
      </div>
      <div class="box box4">
        <h2>Box 4</h2>
        <p>Green</p>
      </div>
      <div class="box box5">
        <h2>Box 5</h2>
        <p>Blue</p>
      </div>
      <div class="box box6">
        <h2>Box 6</h2>
        <p>Indigo</p>
      </div>
    </div>
</body>
</html>
